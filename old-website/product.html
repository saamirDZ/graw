<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Product — Graw Store
  </title>
  <link href="styles.css" rel="stylesheet"/>
 </head>
 <body data-page="product">
  <header class="topbar">
   <div class="container nav">
    <a class="logo" href="index.html">
     Graw Store
     <small>
      TIMELESS ELEGANCE
     </small>
    </a>
    <nav class="links">
     <a href="index.html">
      Home
     </a>
     <a href="men.html">
      Men's Watches
     </a>
     <a href="women.html">
      Women's Watches
     </a>
     <a href="index.html#story">
      About
     </a>
     <a href="index.html#contact">
      Contact
     </a>
    </nav>
    <div class="actions">
     <button class="icon-btn" id="bagOpen">
      ♧
      <span class="bag-count" data-bag-count="">
       0
      </span>
     </button>
    </div>
   </div>
  </header>
  <main class="container detail">
   <div class="detail-grid">
    <div class="detail-image" id="productHero">
     <img alt="" id="detailImage"/>
    </div>
    <div class="detail-copy">
     <span class="tag" id="detailTag">
      New
     </span>
     <h1 id="detailName">
      Graw Store Zenith
     </h1>
     <div class="detail-price" id="detailPrice">
      $499
     </div>
     <div class="rating">
      ★★★★★
      <em>
       4.9 (18)
      </em>
     </div>
     <p id="detailDesc">
     </p>
     <div class="specs" id="specs">
     </div>
     <div class="detail-actions">
      <button class="gold-btn" id="detailAdd">
       Add to Bag
      </button>
     </div>
    </div>
   </div>
  </main>
  <div class="bag-backdrop" id="bagBackdrop">
  </div>
  <aside class="bag-drawer" id="bagDrawer">
   <div class="bag-head">
    <h2>
     Your Bag
    </h2>
    <button class="bag-close" id="bagClose">
     ×
    </button>
   </div>
   <div class="bag-items" id="bagItems">
   </div>
   <div class="bag-summary">
    <div class="sumline">
     <span>
      Subtotal
     </span>
     <b id="bagSubtotal">
      $0
     </b>
    </div>
    <div class="sumline">
     <span>
      Shipping
     </span>
     <b>
      Free
     </b>
    </div>
    <div class="sumline total">
     <span>
      Total
     </span>
     <b id="bagTotal">
      $0
     </b>
    </div>
    <button class="gold-btn checkout">
     Checkout
    </button>
   </div>
  </aside>
  <div class="toast" id="toast">
  </div>
  <script src="app.js">
  </script>
 </body>
</html>
